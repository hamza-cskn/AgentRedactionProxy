name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: ./test/setup-windows.test.ps1
      - name: Test installer with PowerShell 7
        shell: pwsh
        run: ./test/setup-windows.test.ps1

  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global opencode-ai@1.18.31
      - run: npm run test:opencode

  docker:
    needs: [test, windows-installer, opencode]
    runs-on: ubuntu-latest
    env:
      IMAGE: 366366/agent-redaction-proxy
      PUBLISH: ${{ github.repository == 'hamza-cskn/AgentRedactionProxy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: amd64,arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build local smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: agent-redaction-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test non-root read-only container
        run: |
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /data:uid=1000,gid=1000,mode=0700 \
            agent-redaction-proxy:ci node src/main.mjs status
          docker run --rm --read-only agent-redaction-proxy:ci \
            node -e 'if (process.getuid() === 0) process.exit(1)'
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: '366366'
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Publish multi-platform image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=min
